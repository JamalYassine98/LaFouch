name: Publicar a nuvem (funções e regras)

# Item 22 da Fila (aprovado pelo dono 20/11/2026 08:21): a sessão NUVEM publica sem o dono rodar o Cloud Shell.
# SEM CHAVE GUARDADA: o GitHub prova ao Google que é este repositório no ramo main (OIDC / Workload Identity),
# e o Google só aceita essa prova para a conta "github-publica". Configuração feita uma vez pelo dono: docs/PUBLICAR-NUVEM-GITHUB.md
# Roda só quando chamado (botão "Run workflow" ou gh api ... dispatches), só no main, e só depois de TODOS os testes da nuvem passarem.
on:
  workflow_dispatch:
    inputs:
      o_que:
        description: 'O que publicar'
        required: true
        default: functions
        type: choice
        options: [functions, regras, tudo, limpeza, app, info]
      onde:
        description: 'Onde (teste = lafouch-teste, Fase 3; só functions, regras ou tudo)'
        required: true
        default: loja
        type: choice
        options: [loja, teste]

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuvem
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e rodar todos os testes da nuvem (para aqui se algum falhar)
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          for f in teste-*.js; do echo "== $f"; node "$f" || exit 1; done
      - name: Qual projeto (loja real ou teste)
        id: alvo
        env:
          ONDE: ${{ inputs.onde }}
          O_QUE: ${{ inputs.o_que }}
        run: |
          if [ "$ONDE" = teste ]; then
            case "$O_QUE" in functions|regras|tudo) ;; *) echo "no teste só functions, regras ou tudo"; exit 1;; esac
            python3 tools/regras-teste.py --conferir   # as regras do teste são as da loja + relatórios, nunca outra coisa
            P=$(python3 -c "import json;print(json.load(open('tools/teste-projeto.json'))['provedor'])")
            C=$(python3 -c "import json;print(json.load(open('tools/teste-projeto.json'))['conta_publica'])")
            [ "$C" = github-publica@lafouch-teste.iam.gserviceaccount.com ] || { echo "publicação do teste ainda não configurada (tools/teste-projeto.json)"; exit 1; }
            echo "proj=lafouch-teste" >> "$GITHUB_OUTPUT"; echo "config=firebase.teste.json" >> "$GITHUB_OUTPUT"; echo "regras=firestore:rules,storage" >> "$GITHUB_OUTPUT"
          else
            P=projects/462328668572/locations/global/workloadIdentityPools/github/providers/lafouch
            C=github-publica@lafouch-2f6bd.iam.gserviceaccount.com
            echo "proj=lafouch-2f6bd" >> "$GITHUB_OUTPUT"; echo "config=firebase.json" >> "$GITHUB_OUTPUT"; echo "regras=firestore:rules" >> "$GITHUB_OUTPUT"
          fi
          echo "provedor=$P" >> "$GITHUB_OUTPUT"; echo "conta=$C" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.alvo.outputs.provedor }}
          service_account: ${{ steps.alvo.outputs.conta }}
      - name: Rodar a limpeza diária agora (só com o_que=limpeza)
        if: inputs.o_que == 'limpeza' && inputs.onde != 'teste'
        run: gcloud scheduler jobs run firebase-schedule-limpeza-southamerica-east1 --location=southamerica-east1 --project=lafouch-2f6bd
      - name: Só ler informações do projeto (o_que=info; não muda nada)
        if: inputs.o_que == 'info' && inputs.onde != 'teste'
        run: |
          echo "== buckets do Storage"; gcloud storage buckets list --project=lafouch-2f6bd --format='table(name,location,storageClass)' || echo "sem permissão para listar"
          echo "== plano de cobrança"; gcloud billing projects describe lafouch-2f6bd --format='value(billingEnabled)' || echo "sem permissão"
          echo "== selo do App Check por dia (seloDia)"; T=$(gcloud auth print-access-token)
          curl -s -H "Authorization: Bearer $T" "https://firestore.googleapis.com/v1/projects/lafouch-2f6bd/databases/(default)/documents/seloDia?pageSize=60" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(x['name'].split('/')[-1], {k:int(v.get('integerValue',0)) for k,v in sorted(x.get('fields',{}).items())}) for x in d.get('documents',[])] or print(d.get('error',{}).get('message','vazio'))"
      - name: Publicar
        if: inputs.o_que != 'limpeza' && inputs.o_que != 'info'
        env:
          O_QUE: ${{ inputs.o_que }}
          PROJ: ${{ steps.alvo.outputs.proj }}
          CONFIG: ${{ steps.alvo.outputs.config }}
          REGRAS: ${{ steps.alvo.outputs.regras }}
        run: |
          case "$O_QUE" in
            functions) A=functions ;;
            regras) A=$REGRAS ;;
            app) A=hosting ;; # hospedagem parte 1 (20/11): o app (www/) também no Firebase Hosting, em paralelo ao GitHub Pages
            *) A=functions,$REGRAS ;;
          esac
          # sem --force: se o Firebase quiser APAGAR alguma função, ele para (em vez de apagar sozinho)
          npx --yes firebase-tools deploy --only "$A" --config "$CONFIG" --project "$PROJ" --non-interactive
      - name: Conferir a nuvem no ar (tools/sonda-nuvem.sh; só a loja real)
        if: inputs.onde != 'teste'
        run: sleep 20 && bash tools/sonda-nuvem.sh
