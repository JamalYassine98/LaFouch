name: Analise CABE EM TODA TELA (site real, 17 aparelhos, letra 1x a 2x) - so medidas e prints

# S428 (sessao do SITE, pedido do dono 18/11 15:00): mede o site publicado (pecas da nuvem) sem mudar nada no ar.
on:
  workflow_dispatch:
    inputs:
      ramo:
        description: ramo do catalogo
        default: main
      props:
        description: esboco a injetar na copia "prop" (vazio = so o site de hoje)
        default: ''
      telas:
        description: telas (vazio = todas)
        default: ''
      fim:
        description: seletor para foto rolada ate ele (opcional)
        default: ''
      urls:
        description: sites de fora para comparar, nome|endereco separados por virgula (opcional)
        default: ''
      video:
        description: 1 = grava o video hoje x proposta do menu no tamanho do Xiaomi (em vez da analise)
        default: ''
      portas:
        description: versoes e portas (opcional; ex. hoje:8000,propA:8001,propB:8002 - a 8002 serve a mesma copia prop)
        default: ''
      aparelhos:
        description: aparelhos LxA separados por virgula (vazio = os 17)
        default: ''

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        parte: [[0, 4], [4, 8], [8, 12], [12, 17]]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: JamalYassine98/catalogo, path: site, ref: '${{ inputs.ramo }}' }
      - name: Copia do site (com o site aberto para medir, como o administrador ve)
        run: |
          python3 - <<'P'
          p='site/js/lf-site.js';s=open(p,encoding='utf-8').read()
          assert s.count('function manut(){')==1
          s=s.replace('function manut(){','function manut(){CFG.ativo=true;',1)
          open(p,'w',encoding='utf-8').write(s)
          P
          python3 tools/teste-site/prep.py site t "${{ inputs.props }}"
          (cd t/hoje && nohup python3 -m http.server 8000 >/dev/null 2>&1 &)
          (cd t/prop && nohup python3 -m http.server 8001 >/dev/null 2>&1 &)
          (cd t/prop && nohup python3 -m http.server 8002 >/dev/null 2>&1 &)
          pip install playwright && python3 -m playwright install --with-deps chromium
      - name: Medir
        env:
          LF_TELAS: ${{ inputs.telas }}
          LF_APARELHOS: ${{ inputs.aparelhos }}
          LF_URLS: ${{ inputs.urls }}
          LF_FIM: ${{ inputs.fim }}
          LF_FOTOS: ${{ inputs.aparelhos != '' && '1' || '0' }}
          LF_PORTAS: ${{ inputs.portas != '' && inputs.portas || (inputs.props != '' && 'hoje:8000,prop:8001' || 'hoje:8000') }}
        run: |
          if [ "${{ inputs.video }}" = "1" ]; then
            if [ "${{ matrix.parte[0] }}" = "0" ]; then python3 tools/teste-site/video.py an; else mkdir -p an; fi
          else
            python3 tools/teste-site/analise.py site an ${{ matrix.parte[0] }} ${{ matrix.parte[1] }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'analise-${{ matrix.parte[0] }}', path: an }

  juntar:
    needs: [medir]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: r }
      - name: Gravar no ramo resultados-analise
        run: |
          cd r && git init -q && git checkout -q -b resultados-analise
          git config user.name "teste-site" && git config user.email "teste-site@users.noreply.github.com"
          echo "run ${{ github.run_id }} $(date -u)" > RODADA.txt
          git add -A && git commit -q -m "analise cabe em toda tela (run ${{ github.run_id }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultados-analise
