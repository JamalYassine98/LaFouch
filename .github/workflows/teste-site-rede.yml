name: Teste do SITE em internet fraca (mede onde o tempo vai) - so le o site no ar

on:
  workflow_dispatch:

jobs:
  rede:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          for i in 1 2 3; do echo "== 4G fraco, visita nova $i"; python tools/teste-site/rede.py https://lafouch.com/ fraco; done
          echo "== 4G bom, visita nova"; python tools/teste-site/rede.py https://lafouch.com/ bom
