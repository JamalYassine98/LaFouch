name: Publicar atualização do app

# Publica www/ no GitHub Pages a cada mudança no app. Os aparelhos baixam a versão nova sozinhos (sem gerar APK).
on:
  push:
    branches: [main]
    paths: ['www/**', 'src/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir que o app montado esta em dia
        run: node build.js --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: d
        uses: actions/deploy-pages@v4
