name: Teste no Android emulado (so prints, nao gera APK para o dono)

on:
  workflow_dispatch:
    inputs:
      idioma:
        description: idioma do Android
        default: pt-BR

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Montar o app
        run: |
          npm install --legacy-peer-deps
          node build.js
          npx cap add android
          npx cap sync android
      - name: Firebase (igual ao APK de verdade; sem ele o app cai ao pedir avisos)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then if printf '%s' "$GSJ" | grep -q '"project_info"'; then printf '%s' "$GSJ" > android/app/google-services.json; else echo "$GSJ" | base64 -d > android/app/google-services.json; fi; echo ok; else echo "::warning::sem GOOGLE_SERVICES_JSON"; fi
          npx cap sync android
      - name: Compilar APK de teste (fica so aqui)
        working-directory: android
        run: chmod +x gradlew && for i in 1 2 3; do ./gradlew assembleDebug && break; sleep 60; done && test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Ferramenta CDP
        run: pip install websocket-client
      - name: Android emulado + prints
        id: e1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale ${{ inputs.idioma }}
          script: bash tools/teste-android/roda.sh
      - name: Android emulado + prints (2a tentativa)
        if: steps.e1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale ${{ inputs.idioma }}
          script: bash tools/teste-android/roda.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-android
          path: prints
      - name: Prints num ramo git (o download de artefato e bloqueado para a IA)
        if: always()
        run: |
          mkdir -p prints && cd prints && git init -q -b prints-android && git add -A && git -c user.name=teste -c user.email=teste@users.noreply.github.com commit -qm "prints $(date -u +%F_%H%M)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prints-android
