name: Gerar instalador para Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Montar o app (junta os modulos de src/ em www/app.js)
        run: node build.js

      - name: Gerar o instalador
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: La-Fouch-Windows
          path: desktop/dist/*.exe
