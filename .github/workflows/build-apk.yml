name: Gerar app e APK

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Montar o app (junta os modulos de src/ em www/app.js)
        run: node build.js

      - name: Testes automaticos (contas, lotes, leitor, telas)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          TZ=America/Asuncion python3 tests/run.py > testes.log 2>&1 || { grep -A3 "FALHA\|Traceback\|Error" testes.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; tail -5 testes.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Preparar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Avisos de pedido (Firebase)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then if printf '%s' "$GSJ" | grep -q '"project_info"'; then printf '%s' "$GSJ" > android/app/google-services.json; else echo "$GSJ" | base64 -d > android/app/google-services.json; fi && echo "google-services.json instalado"; else echo "::warning::Sem GOOGLE_SERVICES_JSON: o APK sai sem avisos de pedido"; fi

      - name: Sons dos avisos
        run: |
          mkdir -p android/app/src/main/res/raw
          cp www/sons/*.mp3 android/app/src/main/res/raw/

      - name: Permissao da camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          grep -q 'android.permission.POST_NOTIFICATIONS' $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q 'android.permission.USE_BIOMETRIC' $M || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' $M
          grep -n 'CAMERA\|hardware.camera\|BIOMETRIC' $M

      - name: Janela inicial na cor do app
        run: python3 tools/patch-android-tema.py android/app/src/main/res

      - name: Icone do app (opcional)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LaFouch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  site:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
