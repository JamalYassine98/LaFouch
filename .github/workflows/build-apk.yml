name: Gerar app e APK

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # S334 (15/11/2026): chave FIXA de assinatura, para o APK novo instalar POR CIMA do antigo (sem "conflito de pacote").
      # A chave nunca fica no projeto: é criada aqui na 1a vez e guardada CIFRADA (arquivo chave.enc da release "apk"),
      # trancada pela frase do segredo APK_CHAVE, que só o dono conhece. Sem o segredo, o APK sai com chave provisória (como antes).
      - name: Chave fixa do APK
        env:
          APK_CHAVE: ${{ secrets.APK_CHAVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.android
          if [ -z "$APK_CHAVE" ]; then echo "::warning::Sem o segredo APK_CHAVE: APK assinado com chave provisoria (da conflito ao instalar por cima)"; exit 0; fi
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "APK do app La Fouch" --notes "Arquivos do aplicativo, gerados automaticamente. Nao apagar o arquivo chave.enc."
          NOMES=$(gh release view apk --json assets --jq '.assets[].name')
          if echo "$NOMES" | grep -qx 'chave.enc'; then
            gh release download apk -p chave.enc -O chave.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:APK_CHAVE -in chave.enc -out ~/.android/debug.keystore || { echo "::error::A frase do segredo APK_CHAVE nao abre a chave guardada (a frase foi trocada?)"; exit 1; }
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=La Fouch, O=La Fouch, C=PY"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:APK_CHAVE -in ~/.android/debug.keystore -out chave.enc
            gh release upload apk chave.enc
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i 'SHA' || { echo "::error::A chave guardada nao abriu"; exit 1; }
          echo "CHAVE_FIXA=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Montar o app (junta os modulos de src/ em www/app.js)
        run: node build.js

      - name: Testes automaticos (contas, lotes, leitor, telas)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          TZ=America/Asuncion python3 tests/run.py > testes.log 2>&1 || { grep -A3 "FALHA\|Traceback\|Error" testes.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; tail -5 testes.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      # atualização ao vivo (26/11): o Pages recebe o pacote (www-<v>.zip + zip/soma no version.json); o APK leva o www sem ele
      - name: Pacote da atualizacao ao vivo
        run: node tools/pacote.js

      - name: Preparar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Tirar o pacote do www do APK
        run: node tools/pacote.js --limpa

      - name: Criar projeto Android
        run: npx cap add android

      # o número da versão vira o versionName do Android: o app lê (CapacitorUpdater.current().native) para saber qual APK está instalado
      - name: Numero do APK
        run: |
          N=$(grep -o "lafouch-v[0-9]*" www/sw.js | head -1 | sed 's/lafouch-v//')
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$N\"/" android/app/build.gradle
          grep -n versionName android/app/build.gradle

      - name: Avisos de pedido (Firebase)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then if printf '%s' "$GSJ" | grep -q '"project_info"'; then printf '%s' "$GSJ" > android/app/google-services.json; else echo "$GSJ" | base64 -d > android/app/google-services.json; fi && echo "google-services.json instalado"; else echo "::warning::Sem GOOGLE_SERVICES_JSON: o APK sai sem avisos de pedido"; fi

      - name: Sons dos avisos
        run: |
          mkdir -p android/app/src/main/res/raw
          cp www/sons/*.mp3 android/app/src/main/res/raw/

      - name: Permissao da camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          grep -q 'android.permission.POST_NOTIFICATIONS' $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q 'android.permission.USE_BIOMETRIC' $M || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' $M
          grep -n 'CAMERA\|hardware.camera\|BIOMETRIC' $M

      - name: Impressoras termicas (Wi-Fi e Bluetooth)
        run: python3 tools/patch-android-impressora.py android

      - name: Janela inicial na cor do app
        run: python3 tools/patch-android-tema.py android/app/src/main/res

      - name: Icone das notificacoes (escudo da loja)
        run: |
          cp -r assets/notif/drawable-* android/app/src/main/res/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="lf_notif">#7e4a6e</color></resources>\n' > android/app/src/main/res/values/lf_notif.xml
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'default_notification_icon' not in s:
              meta = '    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_lafouch" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/lf_notif" />\n'
              s = s.replace('</application>', meta + '</application>', 1)
              open(p, 'w').write(s)
          print([l for l in s.splitlines() if 'default_notification' in l])
          PY

      - name: Icone do app (pronto no projeto, sem baixar nada)
        run: |
          cp -r assets/android-res/* android/app/src/main/res/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do for f in ic_launcher ic_launcher_round ic_launcher_foreground ic_launcher_background; do
            test -s android/app/src/main/res/mipmap-$d/$f.png || { echo "::error::Falta o icone mipmap-$d/$f.png — o APK nao sai sem o icone da loja"; exit 1; }; done; done
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || { echo "::error::Falta o icone adaptativo"; exit 1; }
          echo "icone da loja instalado"

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LaFouch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # S334: com a chave fixa, o APK vai para a release "apk" (LaFouch-<build>.apk); o app instalado acha, baixa e oferece instalar.
      - name: Publicar o APK para a atualizacao dentro do app
        if: env.CHAVE_FIXA == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(grep -o 'lafouch-v[0-9]*' www/sw.js | head -1 | grep -o '[0-9]*$')
          test -n "$N"
          cp android/app/build/outputs/apk/debug/app-debug.apk "LaFouch-$N.apk"
          for a in $(gh release view apk --json assets --jq '.assets[].name' | grep '^LaFouch-.*\.apk$' || true); do gh release delete-asset apk "$a" -y; done
          gh release upload apk "LaFouch-$N.apk" --clobber

  site:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
