name: Gerar app e APK

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Montar o app (junta os modulos de src/ em www/app.js)
        run: node build.js

      - name: Testes automaticos (contas, lotes, leitor, telas)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 tests/run.py

      - name: Motor do recorte (fica dentro do app e do site)
        run: |
          npm install --no-save onnxruntime-web@1.17.3
          mkdir -p www/ort
          cp node_modules/onnxruntime-web/dist/ort.min.js www/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm www/ort/
          ls -la www/seg www/ort

      - name: Preparar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permissao da camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          grep -n 'CAMERA\|hardware.camera' $M

      - name: Icone do app (opcional)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LaFouch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  site:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
