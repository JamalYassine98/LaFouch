name: Cotacao La Moneda (Jebai)

# Busca a cotação da La Moneda (sucursal Jebai, em frente à loja) a cada 30 minutos
# e grava no ramo "cotacao" (arquivo lamoneda.json), que o app lê.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotacao
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Buscar e gravar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/cotacao-lamoneda.py
      - name: Guardar a página (para conferir o leitor)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamoneda-html
          path: /tmp/lamoneda/*
          retention-days: 3
