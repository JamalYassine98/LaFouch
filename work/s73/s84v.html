<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#efe8ed;font-family:Inter,system-ui,sans-serif;color:#2a1f27;padding:0;width:600px;height:520px;overflow:hidden}
h1{font:600 22px Fraunces,Georgia,serif;margin:0 0 4px}h2{font:600 16px Fraunces,Georgia,serif;margin:16px 0 8px;color:#8d3a69}.sub{color:#7a6b75;font-size:14px;margin:0 0 10px;line-height:1.5}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.g4{grid-template-columns:repeat(4,1fr)}
.c{background:#fff;border-radius:14px;padding:8px 8px 10px;text-align:center}.c b{display:block;font-size:12.5px;margin-top:2px}.c span{font-size:11px;color:#4a3d46;line-height:1.35;display:block}
.c.rec{outline:3px solid #8d3a69}
</style><script src="../s52/mochi.js"></script></head><body>
<div style="width:600px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fbf6f9"><div id="st" style="height:380px;display:flex;align-items:center"></div><div id="cap" style="font:600 22px Inter,system-ui,sans-serif;color:#8d3a69;margin-top:6px"></div><div style="font-size:12px;color:#9a8b95;margin-top:4px">S84 · óculos, espelho e produto de limpeza</div></div><script>
function limpa(o,esp){let s=mochi(Object.assign({},o));
 s=s.replace(/<path d="M(22|98) 94 Q[^>]*\/>/g,'').replace(/<circle cx="[0-9.]+" cy="[0-9.]+" r="6.5" fill="url\(#mh\)"[^>]*\/>/g,'');
 s=s.replace('<path d="M28 64 C30 48 42 38 58 36" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>','<path d="M30 62 C32 50 41 42 54 39" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"/>');
 if(esp==='lado'){s=s.replace(/<circle cx="60" cy="47" r="12"([^>]*)\/><circle cx="60" cy="47" r="3.2"([^>]*)\/><path d="M53.5 42 q3 -3 7 -3.5"([^>]*)\/>/,'<g transform="rotate(-14 60 66) translate(-14 4)"><circle cx="60" cy="47" r="12"$1/><circle cx="60" cy="47" r="3.2"$2/><path d="M53.5 42 q3 -3 7 -3.5"$3/></g>')}
 return s}
function velho(o){return mochi(o).replace(/<path d="M(22|98) 94 Q[^>]*\/>/g,'').replace(/<circle cx="[0-9.]+" cy="[0-9.]+" r="6.5" fill="url\(#mh\)"[^>]*\/>/g,'')}
/* braço em gota: raiz larga dentro do contorno (fica atrás do corpo), ponta redonda */
function gota(lado,ang,L){L=L||30;const sx=lado<0?22:98,sy=92;
 const p=`M0 -10 C${L*.45} -11 ${L-2} -8.5 ${L} -1 C${L+1.5} 5 ${L-4} 9 ${L-9} 8.5 C${L*.45} 8 ${L*.2} 10 0 10 Z`;
 const rot=lado<0?180-ang:ang;
 return `<g transform="translate(${sx} ${sy}) rotate(${rot})${lado<0?' scale(1 -1)':''}"><path d="${p}" fill="url(#mh)" stroke="#e8c3d6" stroke-width="1.6"/><path d="M${L*.35} -5 Q${L*.62} -6.5 ${L*.8} -3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".8"/></g>`}
function M(o,ae,ad,opt){opt=opt||{};const extra=opt.extra||'';return `<svg viewBox="-16 22 152 112" width="200" height="147" style="overflow:visible">${MD}<g transform="${opt.tr||''}">${gota(-1,ae,opt.L)}${gota(1,ad,opt.L)}${opt.velho?velho(o):limpa(o,opt.esp)}${extra}</g></svg>`}
function ponteiro(ad){const a=ad*Math.PI/180,x=98+Math.cos(a)*30,y=92+Math.sin(a)*30;return `<g transform="translate(${x} ${y})"><rect x="-3" y="-3.4" width="15" height="6.8" rx="3.4" fill="#8d3a69"/><path d="M12 0 H40" stroke="#8d3a69" stroke-width="3" stroke-linecap="round"/><g transform="translate(40 0) scale(.72)"><rect x="-6" y="-9" width="7" height="18" rx="2.5" fill="#8d3a69"/><rect x="0" y="-8" width="17" height="16" rx="6" fill="#fff" stroke="#8d3a69" stroke-width="1.8"/><rect x="12" y="-7.5" width="20" height="6.5" rx="3.2" fill="#fff" stroke="#8d3a69" stroke-width="1.8"/></g></g>`}
const HASTES='<path d="M32 81 C26 79 21 78 16.5 79" fill="none" stroke="#8d3a69" stroke-width="2.6" stroke-linecap="round"/><path d="M88 81 C94 79 99 78 103.5 79" fill="none" stroke="#8d3a69" stroke-width="2.6" stroke-linecap="round"/><circle cx="32.5" cy="81" r="1.8" fill="#e7a6c7"/><circle cx="87.5" cy="81" r="1.8" fill="#e7a6c7"/>';
/* braço na frente com união suave: mesma gota do S73; a raiz desaparece em degradê sobre o corpo */
function frente(lado,ang,L){L=L||30;const sx=lado<0?22:98,sy=92,rot=lado<0?180-ang:ang,r=rot*Math.PI/180;
 const p=`M0 -10 C${L*.45} -11 ${L-2} -8.5 ${L} -1 C${L+1.5} 5 ${L-4} 9 ${L-9} 8.5 C${L*.45} 8 ${L*.2} 10 0 10 Z`;
 const px=sx+Math.cos(r)*4,py=sy+Math.sin(r)*4;
 return `<g transform="translate(${sx} ${sy}) rotate(${rot})${lado<0?' scale(1 -1)':''}"><path d="${p}" transform="translate(2 3)" fill="#c98aab" opacity=".22" filter="url(#sb)"/><path d="${p}" fill="url(#mh)" stroke="#e3b3cc" stroke-width="1.7"/><path d="M${L*.42} -5 Q${L*.66} -6.5 ${L*.84} -3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".85"/></g>`+
 /* união suave: a pele do corpo "cobre" a raiz por dentro do contorno, em degradê */
 `<g clip-path="url(#cc)"><circle cx="${px}" cy="${py}" r="12.5" fill="url(#mbU)" filter="url(#ub)"/></g>`}
const FZ='<defs><radialGradient id="mbU" gradientUnits="userSpaceOnUse" cx="49" cy="55.8" r="73.6"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fff7fa"/><stop offset=".85" stop-color="#f6dfea"/><stop offset="1" stop-color="#ecc9da"/></radialGradient><clipPath id="cc"><path d="M60 30 C95 30 106 58 106 84 C106 108 88 122 60 122 C32 122 14 108 14 84 C14 58 25 30 60 30Z"/></clipPath><filter id="ub" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter><filter id="sb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>';
function M2(o,ae,ad,opt){opt=opt||{};const extra=opt.extra||'',fe=Math.abs(ae)>100,fd=Math.abs(ad)>100,Le=opt.Le||opt.L,Ld=opt.Ld||opt.L;
 return `<svg viewBox="-16 22 152 112" width="200" height="147" style="overflow:visible">${MD}${FZ}${fe?'':gota(-1,ae,Le)}${fd?'':gota(1,ad,Ld)}${limpa(o)}${HASTES}${fe?frente(-1,ae,Le):''}${fd?frente(1,ad,Ld):''}${extra}</svg>`}
function M1(o,ae,ad,opt){opt=opt||{};return `<svg viewBox="-16 22 152 112" width="200" height="147" style="overflow:visible">${MD}${gota(-1,ae,opt.Le||opt.L)}${gota(1,ad,opt.Ld||opt.L)}${limpa(o)}${HASTES}${opt.extra||''}</svg>`}


function armP(L){return `M0 -10 C${L*.45} -11 ${L-2} -8.5 ${L} -1 C${L+1.5} 5 ${L-4} 9 ${L-9} 8.5 C${L*.45} 8 ${L*.2} 10 0 10 Z`}
function armT(lado,ang){const sx=lado<0?22:98,sy=92,rot=lado<0?180-ang:ang;return `translate(${sx} ${sy}) rotate(${rot})${lado<0?' scale(1 -1)':''}`}
/* braço na frente; união suave SÓ na raiz: pele do corpo por cima da raiz, sumindo ao longo do braço (nunca cobre as bordas) */
function frente2(lado,ang,L,op){const p=armP(L),T=armT(lado,ang),id='k'+(lado<0?'e':'d');
 return `<defs><linearGradient id="g${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="8" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="m${id}" maskUnits="userSpaceOnUse" x="-60" y="-40" width="260" height="220"><g transform="${T}"><path d="${p}" transform="translate(-1 0) scale(1 1.08)" fill="url(#g${id})"/></g></mask></defs>
 <g opacity="${op}"><g transform="${T}"><path d="${p}" transform="translate(2 3)" fill="#c98aab" opacity=".2" filter="url(#sb)"/><path d="${p}" fill="url(#mh)" stroke="#e3b3cc" stroke-width="1.7"/><path d="M${L*.42} -5 Q${L*.66} -6.5 ${L*.84} -3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".85"/></g>
 <g clip-path="url(#cc)"><rect x="-60" y="-40" width="260" height="220" fill="url(#mbU)" mask="url(#m${id})"/></g></g>`}
/* quanto a mão está "dentro" do corpo: 1 = no contorno, <1 dentro */
function dentro(lado,ang,L){const sx=lado<0?22:98,rot=(lado<0?180-ang:ang)*Math.PI/180,x=sx+Math.cos(rot)*(L-4),y=92+Math.sin(rot)*(L-4);return Math.hypot((x-60)/46,(y-80)/44)}
function bracoCamadas(lado,ang,L){const d=dentro(lado,ang,L),op=Math.min(1,Math.max(0,(1.02-d)/.14));
 return {tras:op<1?gota(lado,ang,L):'',frente:op>0?frente2(lado,ang,L,op.toFixed(3)):''}}

const E=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tr(keys,t){let i=0;while(i<keys.length-2&&keys[i+1][0]<=t)i++;const a=keys[i],b=keys[i+1];const u=Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]||1)));return a[1]+(b[1]-a[1])*E(u)}
const cl=(x,a,b)=>Math.min(b,Math.max(a,x)),win=(t,a,b,f)=>cl(Math.min((t-a)/f,(b-t)/f),0,1); // janela suave
function tip(lado,ang,L){const sx=lado<0?22:98,r=(lado<0?180-ang:ang)*Math.PI/180;return [sx+Math.cos(r)*(L-5),92+Math.sin(r)*(L-5)]}
/* ---- linha do tempo ---- */
const AE=[[0,40],[.8,40],[1.6,210],[3.6,210],[4.4,40],[5.0,40],[5.8,242],[7.8,242],[8.6,40],
 [9.6,40],[12.6,40],[13.4,195],[16.6,195],[17.4,40],[19.5,40]];
const AD=[[0,40],[9.6,40],[10.4,-22],[12.4,-22],[13.4,195],[16.6,195],[17.4,40],[17.8,40],[18.3,-35],[19.0,-35],[19.5,40]];
const SEG=[[0,4.6,'Ajusta os óculos','os óculos sobem com o empurrão e assentam'],[4.6,9.4,'Tapinha no espelho','o espelho balança e volta ao lugar'],[9.4,19.5,'Limpa os óculos','borrifa o produto, passa a flanela, brilha!']];
const DUR=19.5;
const PUFF=[11.0,11.8];
function borrifador(x,y,sq){return `<g transform="translate(${x} ${y-9})"><rect x="-5.5" y="-12" width="11" height="17" rx="3.5" fill="#8d3a69"/><rect x="-5.5" y="-7" width="11" height="6" fill="#f7d6e6"/><path d="M-3 -4 h6" stroke="#8d3a69" stroke-width="1.2" stroke-linecap="round"/><rect x="-2.2" y="-16" width="4.4" height="4.5" fill="#6e2b51"/><g transform="translate(0 ${sq})"><rect x="-4.5" y="-20.5" width="9" height="5" rx="1.8" fill="#e7a6c7"/><rect x="-8" y="-19.6" width="4" height="2.4" rx="1" fill="#e7a6c7"/></g><path d="M-3.5 -10 v5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/></g>`}
function flanela(x,y,rot,sc){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><path d="M-8 -7 Q0 -9.5 8 -7 Q9.5 0 8 7 Q0 9.5 -8 7 Q-9.5 0 -8 -7Z" fill="#f3bfd6" stroke="#d98fb4" stroke-width="1.2"/><path d="M-5.5 -4.5 Q0 -6 5.5 -4.5 M-5.5 4.5 Q0 6 5.5 4.5" stroke="#fff" stroke-width="1" fill="none" stroke-dasharray="1.6 1.4" opacity=".9"/></g>`}
function estrela(x,y,s,o){return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -5 Q.8 -.8 5 0 Q.8 .8 0 5 Q-.8 .8 -5 0 Q-.8 -.8 0 -5Z" fill="#fff" stroke="#e7a6c7" stroke-width=".7" opacity="${o}"/>`}
function R(t){
 let ae=tr(AE,t),ad=tr(AD,t),L=30;const seg=SEG.find(g=>t>=g[0]&&t<g[1])||SEG[2];
 let face={olha:1},gy=0,gr=0,mr=0,my=0,extraB='',extraF='',fog=0,spark=0,sq=0,hop=0;
 // A) ajusta óculos: empurra 2x; óculos sobem e giram um tiquinho e assentam com mola
 if(t<4.6){const w=win(t,1.6,3.6,.35);const ph=(t-1.6)*Math.PI*1.6;const push=Math.max(0,Math.sin(ph));ae+= -6*push*w;
  gy=-2.6*push*w;gr=-3.2*push*w; // segue a mão
  const tl=t-3.6;if(tl>0&&tl<1){gy+=Math.sin(tl*14)*Math.exp(-tl*5)*.8;gr+=Math.sin(tl*14)*Math.exp(-tl*5)*1.4}}
 // B) tapinha: cada toque empurra o espelho, que balança como mola amortecida
 if(t>=4.6&&t<9.4){const w=win(t,5.8,7.8,.3);let acc=0;for(const k of [6.1,6.7,7.3]){const d=t-k;if(d>0)acc+=Math.sin(d*13)*Math.exp(-d*3.2)*13;if(d>-.12&&d<.12)ae+=-9*(1-Math.abs(d)/.12)}
  mr=acc;my=Math.abs(acc)*.05;face={olha:1}}
 // C) limpeza com produto
 if(t>=9.4){face={olha:1};
  const sb=win(t,9.9,13.0,.35); // borrifador aparece/some com pulinho de escala
  if(sb>0){const [hx,hy]=tip(1,ad,L);let s2=0;for(const p of PUFF){const d=t-p;if(d>-.08&&d<.18)s2=Math.max(s2,1.6*(1-Math.abs(d-.05)/.13))}sq=cl(s2,0,1.6);
   extraB+=`<g transform="translate(${hx} ${hy}) scale(${(.4+.6*E(sb)).toFixed(3)}) translate(${-hx} ${-hy})" opacity="${sb}">${borrifador(hx,hy,sq)}</g>`;
   // névoa saindo do bico até as lentes
   for(const p of PUFF){const d=t-p;if(d>0&&d<.7){const q=d/.7,nx=hx-8,ny=hy-19;for(let k=0;k<12;k++){const tx=k%2?75:45,ty=83+((k*7)%5-2)*3;const e=E(Math.min(1,q*1.25));const x=nx+(tx-nx)*e+Math.sin(k*3.1)*4*q,y=ny+(ty-ny)*e+Math.cos(k*2.3)*4*q;
     extraF+=`<circle cx="${x}" cy="${y}" r="${(1.4+q*3.4).toFixed(2)}" fill="#fff" stroke="#e7c3d6" stroke-width=".4" opacity="${((1-q)*.85).toFixed(3)}"/>`}}}}
  // lentes embaçadas depois do borrifo; a flanela limpa aos poucos
  const f1=cl((t-11.25)/.3,0,1)*.5+cl((t-12.05)/.3,0,1)*.5;const lim=cl((t-13.6)/2.8,0,1);fog=f1*(1-lim);
  // flanelas: esquerda aparece cedo; direita "vira" flanela depois do borrifador
  const fl=win(t,9.9,17.6,.35),fr=win(t,13.0,17.6,.35);
  const wig=t>13.6&&t<16.6?1:0;if(wig){ae+=Math.sin(t*10)*7;ad+=Math.sin(t*10+Math.PI)*7}
  const [lx,ly]=tip(-1,ae,L),[rx,ry]=tip(1,ad,L);
  if(fl>0)extraF+=flanela(lx+1,ly-1,-15+Math.sin(t*10)*8*wig,(.4+.6*E(fl)).toFixed(3));
  if(fr>0)extraF+=flanela(rx-1,ry-1,15-Math.sin(t*10)*8*wig,(.4+.6*E(fr)).toFixed(3));
  spark=win(t,16.7,18.6,.25);if(t>16.6)face={feliz:1};
  if(t>17.6&&t<19.2){const d=t-17.6;hop=Math.max(0,Math.sin(d*Math.PI/0.55))*6*(d<1.1?1:0)}}
 const br=Math.sin(t*2.4)*.018,sqb=hop>0?(hop<2?-.05*(1-hop/2):.03):0,sx=1+br*.6-sqb,sy=1-br+sqb,tilt=Math.sin(t*1.1)*1.6;
 const bl=((t%3.7)<.12)&&!face.feliz;const f=Object.assign({},face,bl?{pisca:1}:{});
 let m=limpa(f);
 const fogS=fog>0?`<g opacity="${fog.toFixed(3)}"><circle cx="45" cy="83" r="12" fill="#fff" opacity=".7"/><circle cx="75" cy="83" r="12" fill="#fff" opacity=".7"/>${[[40,79],[49,86],[44,88],[70,80],[79,86],[74,89],[51,78],[81,78]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.3" fill="#fff" stroke="#e3bfd2" stroke-width=".5"/>`).join('')}</g>`:'';
 m=m.replace('<g fill="url(#mlz)"',`<g transform="rotate(${gr.toFixed(2)} 60 83) translate(0 ${gy.toFixed(2)})"><g fill="url(#mlz)"`).replace(/(<path d="M36 76 l4 -2.5[^>]*\/>)/,`$1${fogS}${HASTES}</g>`);
 m=m.replace(/(<circle cx="60" cy="47" r="12"[\s\S]*?<path d="M53.5 42[^>]*\/>)/,`<g transform="translate(0 ${my.toFixed(2)}) rotate(${mr.toFixed(2)} 60 58)">$1</g>`);
 const sp=spark>0?[[52,73,1.5],[82,74,1.2],[38,91,.9]].map(([x,y,k],i)=>estrela(x,y,(k*(.6+.4*Math.sin(t*9+i*2))*E(spark)).toFixed(3),spark.toFixed(2))).join(''):'';
 const A1=bracoCamadas(-1,ae,L),A2=bracoCamadas(1,ad,L);
 const inner=`${extraB}${A1.tras}${A2.tras}${m}${sp}${A1.frente}${A2.frente}${extraF}`;
 document.getElementById('st').innerHTML=`<svg viewBox="-22 18 164 116" width="560" height="396" style="overflow:visible">${MD}${FZ}<ellipse cx="60" cy="126" rx="${30-hop*1.2}" ry="4" fill="#8d3a69" opacity="${.12-hop*.006}"/><g transform="translate(60 124) translate(0 ${-hop}) rotate(${tilt}) scale(${sx} ${sy}) translate(-60 -124)">${inner}</g></svg>`;
 document.getElementById('cap').innerHTML=`${seg[2]}<div style="font:400 13px Inter,system-ui,sans-serif;color:#7a6b75;margin-top:2px">${seg[3]}</div>`}
window.R=R;window.DUR=DUR;R(0);</script></body></html>
