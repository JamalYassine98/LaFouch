<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- S421 (opção A do dono): o simulador usa as MESMAS letras do celular Android (Roboto e Noto Serif). -->
<fontconfig>
 <match target="pattern"><test name="family"><string>Inter</string></test><edit name="family" mode="assign" binding="strong"><string>Roboto</string></edit></match>
 <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
 <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
 <alias binding="strong"><family>Segoe UI</family><prefer><family>Roboto</family></prefer></alias>
 <alias binding="strong"><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
 <alias binding="strong"><family>Georgia</family><prefer><family>Noto Serif</family></prefer></alias>
 <alias binding="strong"><family>Times New Roman</family><prefer><family>Noto Serif</family></prefer></alias>
 <alias binding="strong"><family>Fraunces</family><prefer><family>Noto Serif</family></prefer></alias>
</fontconfig>
