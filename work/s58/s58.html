<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#efe8ed;font-family:Inter,system-ui,sans-serif;color:#2a1f27;padding:24px;width:1500px}
h1{font:600 24px Fraunces,Georgia,serif;margin:0 0 4px}.sub{color:#7a6b75;font-size:14.5px;margin:0 0 14px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c{background:#fff;border-radius:18px;padding:12px 14px;text-align:center}.c.rec{outline:3px solid #8d3a69}
.c h3{font:600 16px Fraunces,serif;margin:4px 0 2px}.c p{font-size:12.5px;color:#4a3d46;margin:0;line-height:1.45}
.tag{display:inline-block;background:#8d3a69;color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:2px 9px}
</style><script src="../s52/mochi.js"></script></head><body>
<h1>S58 · Novas ideias para o Mochi apontar a linha</h1>
<p class="sub">Formas finas, retas e com ponta "de seta/indicador" — nada de cabo arredondado nem ponta em bola. Cada uma na mão do Mochi apontando a linha.</p>
<div class="g" id="g"></div>
<script>
const D='<defs><linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset=".5" stop-color="#c9d1db"/><stop offset="1" stop-color="#9aa5b3"/></linearGradient><linearGradient id="vi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b45d8e"/><stop offset="1" stop-color="#7a2f5b"/></linearGradient></defs>';
/* cada ferramenta desenhada a partir da mão (0,0), apontando para a direita */
const T={
 mao:`${D}<path d="M0 -2 h62" stroke="#8d3a69" stroke-width="4" stroke-linecap="round"/><g transform="translate(62 -2)"><rect x="-6" y="-9" width="7" height="18" rx="2.5" fill="#8d3a69"/><rect x="0" y="-8" width="17" height="16" rx="6" fill="#fff" stroke="#8d3a69" stroke-width="1.8"/><rect x="12" y="-7.5" width="20" height="6.5" rx="3.2" fill="#fff" stroke="#8d3a69" stroke-width="1.8"/><ellipse cx="7" cy="-8.5" rx="4.5" ry="3" fill="#fff" stroke="#8d3a69" stroke-width="1.6"/><path d="M4 1.5 h9 M4 5 h8" stroke="#e7c3d6" stroke-width="1.4" stroke-linecap="round"/></g>`,
 laser:`${D}<rect x="-2" y="-5" width="40" height="10" rx="2.5" fill="url(#vi)"/><rect x="30" y="-4" width="12" height="8" rx="1.5" fill="url(#mt)"/><circle cx="12" cy="0" r="2.2" fill="#ffd34d"/><path d="M44 0 L104 20" stroke="#ff5c93" stroke-width="2" opacity=".45"/><circle cx="104" cy="20" r="4.5" fill="#ff5c93"/><circle cx="104" cy="20" r="9" fill="#ff5c93" opacity=".22"/>`,
 seta:`${D}<rect x="-4" y="-5" width="22" height="10" rx="2" fill="url(#vi)"/><path d="M5 -5 v10 M10 -5 v10" stroke="#5e2347" stroke-width="1"/><path d="M18 -2.4 h34 v4.8 h-34z" fill="url(#mt)"/><path d="M52 -1.8 h30 v3.6 h-30z" fill="url(#mt)"/><path d="M82 -1.2 h22 v2.4 h-22z" fill="url(#mt)"/><path d="M104 -7 l14 7 l-14 7 z" fill="#8d3a69"/>`,
 caneta:`${D}<rect x="-4" y="-5.5" width="46" height="11" rx="2" fill="url(#vi)"/><rect x="4" y="-8.5" width="22" height="3" rx="1.5" fill="url(#mt)"/><path d="M42 -2 h40 v4 h-40z" fill="url(#mt)"/><path d="M82 -1.2 h26 v2.4 h-26z" fill="url(#mt)"/><path d="M108 -4 l9 4 l-9 4z" fill="#8d3a69"/>`,
 estrela:`${D}<path d="M0 0 h96" stroke="#8d3a69" stroke-width="3.5" stroke-linecap="round"/><g transform="translate(106 0) rotate(-10)"><path d="M0 -11 L3 -3.5 L11 -3.4 L4.8 1.5 L7 9.5 L0 5 L-7 9.5 L-4.8 1.5 L-11 -3.4 L-3 -3.5Z" fill="#f7c95c" stroke="#e3a43a" stroke-width="1.4" stroke-linejoin="round"/></g><path d="M120 -10 l4 -3 M122 4 h5" stroke="#f2b24c" stroke-width="2" stroke-linecap="round"/>`,
 regua:`${D}<g transform="translate(0 -8) rotate(8)"><rect x="0" y="0" width="120" height="16" rx="3" fill="#fff6e0" stroke="#d9a441" stroke-width="1.6"/>${Array.from({length:12},(_,i)=>`<path d="M${8+i*9.5} 0 v${i%2?5:8}" stroke="#b9852f" stroke-width="1.2"/>`).join('')}<text x="58" y="13.5" font-size="6" font-family="Inter" fill="#b9852f" text-anchor="middle">40 cm</text><path d="M120 3 l8 5 l-8 5z" fill="#8d3a69"/></g>`,
 dedo:`${D}<g><path d="M6 -4 q22 -2 30 2" stroke="none"/><circle cx="34" cy="-1" r="3" fill="#f2b24c"/><path d="M42 -6 l5 -3 M44 0 h6 M42 5 l5 3" stroke="#f2b24c" stroke-width="2.2" stroke-linecap="round"/></g>`,
 lanterna:`${D}<rect x="-2" y="-6" width="34" height="12" rx="3" fill="url(#vi)"/><path d="M32 -6 l10 -4 v20 l-10 -4z" fill="url(#mt)"/><path d="M42 -10 L150 12 L150 40 L42 10Z" fill="#ffe9a8" opacity=".55"/><rect x="118" y="20" width="40" height="10" rx="3" fill="#ffd34d" opacity=".5"/>`};
const L=[['mao','A · Mãozinha que aponta','Haste fina e uma luvinha branca com o dedinho apontando — o clássico "veja aqui", fofo e sem dúvida do que é.',1],
 ['laser','B · Canetinha laser','Ele aponta com uma luzinha rosa: o pontinho pisca na linha. Sem haste comprida.',1],
 ['seta','C · Ponteiro com seta','Telescópico fino e reto, cabo retangular e ponta em seta vinho (como ponteiro de professor).',0],
 ['caneta','D · Caneta-ponteiro','Parece uma caneta com clipe que estica; ponta triangular pequena.',0],
 ['estrela','E · Varinha fina de estrela','Varinha fininha com estrela dourada achatada e brilhos.',0],
 ['regua','F · Réguinha de 40 cm','Uma réguinha amarela com "40 cm" escrito, ponta em seta — lembra a distância do teste.',0],
 ['dedo','G · Só a mãozinha dele','Sem ferramenta: o Mochi aponta com a própria mão e sai um brilho na linha.',0],
 ['lanterna','H · Lanterninha','Uma lanterninha de consultório que ilumina a linha.',0]];
document.getElementById('g').innerHTML=L.map(([k,n,d,r])=>{const ad=k==='dedo'?2:22,a=ad*Math.PI/180,hx=98+21*Math.cos(a),hy=94+21*Math.sin(a);
 const rot=k==='laser'||k==='lanterna'?0:8;
 return `<div class="c ${r?'rec':''}">${r?'<span class="tag">RECOMENDADO</span>':'<span class="tag" style="opacity:0">-</span>'}<svg viewBox="0 0 330 150" width="330" height="150" fill="none" style="overflow:visible">${mochi({ad,olha:1})}
 <g transform="translate(200 ${k==='laser'?134:k==='lanterna'?136:132})"><rect x="0" y="-12" width="124" height="24" rx="8" fill="#fdeaf3"/><text x="9" y="5" font-family="Georgia" font-size="12.5" fill="#2a1f27">O café está pronto.</text></g>
 <g transform="translate(${hx} ${hy}) rotate(${rot}) scale(.95)">${T[k]}</g></svg><h3>${n}</h3><p>${d}</p></div>`}).join('');
</script></body></html>
