const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function cena(k,nome){const r0=R[k].r0,r1=R[k].r1;
  $('t1').textContent=nome;$('t2').textContent='Tocar no cartão: a foto cresce até o produto';
  $('L').style.backgroundImage='url('+IM['L_'+k]+')';$('D').style.backgroundImage='url('+IM['Dh_'+k]+')';$('L').style.opacity=1;$('D').style.opacity=0;
  const fl=$('fly'),pr=$('press'),dd=$('dedo');$('fi').src=r0.src;
  await sleep(900);
  dd.style.display='block';dd.style.left=(r0.x+r0.w/2)+'px';dd.style.top=(r0.y+r0.h/2)+'px';
  pr.style.cssText='display:block;left:'+r0.cx+'px;top:'+r0.cy+'px;width:'+r0.cw+'px;height:'+r0.ch+'px;background-image:url('+IM['L_'+k]+');background-position:-'+r0.cx+'px -'+r0.cy+'px';
  await pr.animate([{transform:'scale(1)'},{transform:'scale(.96)'}],{duration:120,fill:'forwards',easing:'ease-out'}).finished;
  dd.style.display='none';
  fl.style.cssText='display:block;left:'+r0.x+'px;top:'+r0.y+'px;width:'+r0.w+'px;height:'+r0.h+'px;border-radius:14px';
  pr.animate([{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:200,fill:'forwards'});
  $('D').animate([{opacity:0},{opacity:1}],{duration:260,delay:70,fill:'forwards',easing:'ease-out'});
  $('L').animate([{opacity:1},{opacity:0}],{duration:260,delay:70,fill:'forwards'});
  setTimeout(()=>pr.style.display='none',300);
  await fl.animate([{left:r0.x+'px',top:r0.y+'px',width:r0.w+'px',height:r0.h+'px',borderRadius:'14px'},{left:r1.x+'px',top:r1.y+'px',width:r1.w+'px',height:r1.h+'px',borderRadius:'14px'}],{duration:360,easing:E,fill:'forwards'}).finished;
  fl.style.boxShadow='none';
  await sleep(1500);
  $('t2').textContent='Voltar: a foto volta para o cartão';await sleep(500);
  fl.style.boxShadow='0 18px 40px rgba(0,0,0,.45)';
  $('D').animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'});$('L').animate([{opacity:0},{opacity:1}],{duration:240,fill:'forwards'});
  await fl.animate([{left:r1.x+'px',top:r1.y+'px',width:r1.w+'px',height:r1.h+'px'},{left:r0.x+'px',top:r0.y+'px',width:r0.w+'px',height:r0.h+'px'}],{duration:320,easing:E,fill:'forwards'}).finished;
