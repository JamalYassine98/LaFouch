<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ARGUS · as letras do Android no simulador (aprovado 25/11 10:07). O navegador das telas de celular (motor/abrir.py) só
     enxerga as letras que um Android tem: Roboto (a letra de tudo), uma com serifa e uma de máquina. Assim, como no celular,
     "Segoe UI", "Inter", system-ui e sans-serif caem todas na Roboto. O navegador do PC fica como está.
     A Noto Serif do Android não está instalada aqui: a com serifa é a Liberation Serif (a mesma do simulador de sempre). -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/google-fonts/ofl/roboto</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/tmp/argus-letras-android</cachedir>
  <selectfont><rejectfont>
    <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
    <pattern><patelt name="family"><string>Liberation Sans Narrow</string></patelt></pattern>
    <pattern><patelt name="family"><string>DejaVu Sans</string></patelt></pattern>
    <pattern><patelt name="family"><string>DejaVu Serif</string></patelt></pattern>
    <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
  </rejectfont></selectfont>
  <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <match target="pattern"><test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test><test qual="all" name="family" compare="not_eq"><string>serif</string></test><test qual="all" name="family" compare="not_eq"><string>monospace</string></test><edit name="family" mode="append_last"><string>sans-serif</string></edit></match>
</fontconfig>
